spring:
  application:
    name: golden-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    placeholders:
      id_type: NUMBER(19)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # In-house IdP (spec pending, P0-7). Keycloak stands in until then.
          jwk-set-uri: ${IDP_JWK_SET_URI:http://localhost:8180/realms/eco/protocol/openid-connect/certs}

golden:
  topics:
    service-request-submitted: service-requests.submitted

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
